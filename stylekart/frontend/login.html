<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - StyleKart</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header>

    <div class="logo">
        StyleKart
    </div>

    <a href="index.html">
        Home
    </a>

</header>


<div class="login-container">

    <div class="login-box">

        <h2>Login</h2>

        <p>Welcome back to StyleKart</p>


        <form onsubmit="login(event)">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p>
            Don't have an account?
            <a href="#">Create Account</a>
        </p>

    </div>

</div>
<script src="js/script.js"></script>
</body>
</html>
